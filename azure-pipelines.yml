trigger:
 branches:
   include:
     - main
     
pool: sepagentpool

stages:
  - stage: 
    displayName: infrapipeline
    jobs:
      - job: 
        displayName: terraform init plan apply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'sepsvc'
            backendAzureRmOverrideSubscriptionID: '79f5ea50-ad19-4eb9-9f3f-ffa0941f38d5'
            backendAzureRmResourceGroupName: 'RG-Backend'
            backendAzureRmStorageAccountName: 'backendstoragevik'
            backendAzureRmContainerName: 'backendcontainer'
            backendAzureRmKey: 'sep.tfstate'
        - task: tfsec@1
          inputs:
            version: 'v1.26.0'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'sepsvc'
            environmentAzureRmOverrideSubscriptionID: '79f5ea50-ad19-4eb9-9f3f-ffa0941f38d5'
  - stage: 
    displayName: manualapproval
    
    jobs:
      - job: 
        displayName: manual approval
        pool: server
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'user@example.com'
            instructions: '''Approve this deployment to continue.'''
  - stage: 
    displayName: terraformapply
    jobs:
      - job: 
        displayName: terraform apply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'sepsvc'
            backendAzureRmOverrideSubscriptionID: '79f5ea50-ad19-4eb9-9f3f-ffa0941f38d5'
            backendAzureRmResourceGroupName: 'RG-Backend'
            backendAzureRmStorageAccountName: 'backendstoragevik'
            backendAzureRmContainerName: 'backendcontainer'
            backendAzureRmKey: 'sep.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            environmentServiceNameAzureRM: 'sepsvc'
            environmentAzureRmOverrideSubscriptionID: '79f5ea50-ad19-4eb9-9f3f-ffa0941f38d5'
